let currentLang = 'pt';
let sessionStats = {

function getMostChosenStat() {
    let maxCount = -1;
    let maxStat = '';
    const counts = sessionStats.chosenStatsCounts;
    Object.keys(counts).forEach(key => {
        if (counts[key] > maxCount) {
            maxCount = counts[key];
            maxStat = key;
        }
    });
    if (maxCount <= 0) return currentLang === 'pt' ? 'Nenhuma propriedade selecionada ainda' : 'No properties selected yet';
    return t('stats', maxStat) + ` (${maxCount}x)`;
}

function getDiscoveredMaterialsList() {
    if (sessionStats.materialsDiscovered.size === 0) {
        return currentLang === 'pt' ? 'Nenhum material registrado ainda nesta sessão.' : 'No materials recorded in this session yet.';
    }
    const names = [];
    sessionStats.materialsDiscovered.forEach(id => {
        const mat = MASTER_DECK.find(m => m.id === id);
        if (mat) {
            names.push(mat.title[currentLang]);
        }
    });
    return names.join(', ');
}

function recordMatchEnd(playerWon) {
    if (isMatchRecorded) return;
    isMatchRecorded = true;
    if (playerWon) {
        sessionStats.matchesWon++;
    } else {
        sessionStats.matchesLost++;
    }
}
const t = (key, nestedKey) => nestedKey ? (i18n[currentLang][key]?.[nestedKey] ?? nestedKey) : (i18n[currentLang][key] ?? key);


// ── BARALHO DINÂMICO DO GITHUB ──────────────────────────────────────────────────
let MASTER_DECK = [];

async function loadDeck() {
    try {
        const response = await fetch(CSV_URL);
        const textData = await response.text();
        const rows = textData.split('\n');
        MASTER_DECK = [];
        
        if (rows.length === 0) return;
        
        const headerRow = rows[0].trim().split(';');
        
        function findColIndex(possibleNames, defaultIdx) {
            for (let name of possibleNames) {
                const idx = headerRow.findIndex(h => {
                    const normalizedH = h.trim().toLowerCase().replace(/_/g, ' ').replace(/\s+/g, ' ');
                    const normalizedName = name.toLowerCase().replace(/_/g, ' ').replace(/\s+/g, ' ');
                    return normalizedH === normalizedName || normalizedH.includes(normalizedName);
                });
                if (idx !== -1) return idx;
            }
            return defaultIdx;
        }

        const colId = findColIndex(['id'], 0);
        const colTitlePt = findColIndex(['titulo pt', 'titulo_pt', 'title pt', 'title_pt'], 1);
        const colLifetime = findColIndex(['vida util', 'vida_util', 'lifetime'], 2);
        const colCost = findColIndex(['custo', 'cost'], 3);
        const colImpact = findColIndex(['impacto diario', 'impacto_diario', 'daily impact', 'impact'], 4);
        const colResistance = findColIndex(['resistencia', 'resistance'], 5);
        const colMaxTemp = findColIndex(['temp max', 'temp_max', 'max temp', 'maxtemp'], 6);
        const colTitleEn = findColIndex(['titulo en', 'titulo_en', 'title en', 'title_en'], 8);
        const colIcon = findColIndex(['nome imagem', 'nome_imagem', 'image name', 'image', 'icon'], 9);
        const colDescPt = findColIndex(['descricao pt', 'descricao_pt', 'description pt', 'description_pt'], 10);
        const colDescEn = findColIndex(['descricao en', 'descricao_en', 'description en', 'description_en'], 11);

        for (let i = 1; i < rows.length; i++) {
            const row = rows[i].trim();
            if (row === '') continue;
            
            const cols = row.split(';'); // Ponto e vírgula do Excel-BR
            MASTER_DECK.push({
                id: parseInt(cols[colId]),
                icon: cols[colIcon] || 'box',
                color: 'bg-blue-600',
                stats: {
                    lifetime: parseInt(cols[colLifetime]),
                    cost: parseInt(cols[colCost]),
                    impact: parseInt(cols[colImpact]),
                    resistance: parseInt(cols[colResistance]),
                    maxTemp: parseInt(cols[colMaxTemp])
                },
                title: { pt: cols[colTitlePt], en: cols[colTitleEn] },
                type: { pt: "Material", en: "Material" },
                desc: { pt: cols[colDescPt], en: cols[colDescEn] }
            });
        }
        console.log("Cartas carregadas:", MASTER_DECK.length);
    } catch (error) {
        console.error("Erro ao carregar o baralho:", error);
    }
}

function _showToast(msg) {
    const existing = document.getElementById('_toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.id = '_toast';
    toast.textContent = msg;
    toast.className = 'fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-red-800 border border-red-600 text-white text-sm font-semibold px-5 py-3 rounded-xl shadow-xl transition-opacity duration-500';
    document.body.appendChild(toast);
    setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 3000);
}

// ── COMUNICAÇÃO GOOGLE SHEETS (ANTI-CORS) ─────────────────────────────────────
async function sheetPost(data) {
    try {
        const response = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(data),
            redirect: 'follow'
        });
        return await response.json();
    } catch (err) {
        console.error("Erro na comunicação com Sheets (POST):", err);
        return { success: false };
    }
}

async function sheetGet(action, extraParams = "") {
    try {
        const response = await fetch(`${APPS_SCRIPT_URL}?action=${action}${extraParams}`, {
            method: 'GET',
            redirect: 'follow'
        });
        return await response.json();
    } catch (err) {
        console.error("Erro no GET do Sheets:", err);
        return { success: false };
    }
}

function startPolling() {
    if (pollingInterval) clearInterval(pollingInterval);
    pollingInterval = setInterval(syncRoomState, 3000);
}

function stopPolling() {
    if (pollingInterval) clearInterval(pollingInterval);
    isPolling = false;
}

// ── AUTENTICAÇÃO SIMPLES ──────────────────────────────────────────────────────
function enterGame() {
    const nameInput = document.getElementById('playerName').value.trim();
    if (!nameInput) {
        _showToast(currentLang === 'pt' ? 'Digite um nome válido!' : 'Enter a valid name!');
        return;
    }
    playSfx('click');
    currentProfile = {
        id: 'user_' + Math.random().toString(36).substr(2, 9),
        nickname: nameInput.substring(0, 20)
    };
    appMode = 'lobby';
    playMusic(); // Inicia a música de fundo
    render();
    loadRooms();
}

function signOut() {
    playSfx('click');
    if (currentRoomId) leaveRoom(true);
    currentProfile = null;
    isOfflineMode  = false;
    appMode = 'auth';
    render();
}

// ── LOBBY ─────────────────────────────────────────────────────────────────────
async function loadRooms() {
    if (!currentProfile) return;
    const loadingBtn = document.getElementById('btn-refresh');
    if(loadingBtn) loadingBtn.classList.add('animate-spin');

    const res = await sheetGet('getRooms');
    if (res && res.success) {
        availableRooms = res.rooms || [];
    }
    if (appMode === 'lobby') render();
}

async function createRoom() {
    if (APPS_SCRIPT_URL === 'SUA_NOVA_URL_AQUI') {
        _showToast('Configure a URL do Google Sheets no código!');
        return;
    }
    if (MASTER_DECK.length < 10) {
        _showToast('Erro: Baralho do GitHub não carregou cartas suficientes.');
        return;
    }

    playSfx('click');
    appMode = 'loading';
    render();

    const shuffled = [...MASTER_DECK].sort(() => Math.random() - 0.5);
    const selected = shuffled.slice(0, 10);

    const initialGameState = {
        player1_deck: selected.slice(0, 5),
        player2_deck: selected.slice(5, 10),
        tied_cards: [],
        current_turn: currentProfile.id,
        game_phase: 'playing',
        selected_stat: null,
        round_winner: null,
        winner_id: null
    };

    const res = await sheetPost({
        action: 'createRoom',
        player1: currentProfile.nickname,
        gameState: initialGameState
    });

    if (res && res.success) {
        sessionStats.matchesPlayed++;
        sessionStats.onlineMatches++;
        isMatchRecorded = false;
        isPlayer1 = true;
        currentRoomId = res.roomId;
        currentRoomData = { status: 'waiting', player2: '', gameState: initialGameState };
        syncLocalStateFromData(initialGameState);
        appMode = 'game';
        startPolling();
        render();
    } else {
        appMode = 'lobby';
        _showToast('Erro ao criar sala. Verifique a URL do App Script.');
        render();
    }
}

async function joinRoom(roomId) {
    playSfx('click');
    appMode = 'loading';
    render();

    const res = await sheetPost({
        action: 'joinRoom',
        roomId: roomId,
        player2: currentProfile.nickname
    });

    if (res && res.success) {
        sessionStats.matchesPlayed++;
        sessionStats.onlineMatches++;
        isMatchRecorded = false;
        isPlayer1 = false;
        currentRoomId = roomId;
        currentRoomData = { status: 'playing', player2: currentProfile.nickname, gameState: res.gameState };
        syncLocalStateFromData(res.gameState);
        appMode = 'game';
        startPolling();
        render();
    } else {
        appMode = 'lobby';
        _showToast(res.error || 'Erro ao entrar na sala.');
        await loadRooms();
        render();
    }
}

async function leaveRoom(silent = false) {
    stopPolling();
    stopSfx('tick'); // Interrompe o som de tick/carregamento residual
    if (currentRoomId && currentRoomData && currentRoomData.status !== 'finished') {
        sheetPost({ action: 'updateState', roomId: currentRoomId, gameState: currentRoomData.gameState, status: 'finished' });
    }
    currentRoomId = null;
    currentRoomData = null;
    isPlayer1 = false;
    
    if (!silent) {
        appMode = 'lobby';
        render();
        await loadRooms();
    }
}

function playOffline() {
    if (MASTER_DECK.length < 10) {
        _showToast('Erro: Baralho do GitHub não carregou cartas suficientes.');
        return;
    }
    playSfx('click');
    isOfflineMode = true;
    currentRoomId = null;
    stopPolling();
    gameState = 'start';
    playerDeck = []; cpuDeck = []; tiedCards = [];
    turn = 'player'; selectedStat = null; roundWinner = null;
    appMode = 'game';
    render();
}

function goToLobby() {
    playSfx('click');
    stopSfx('tick'); // Interrompe o som de tick/carregamento residual
    isOfflineMode = false;
    currentRoomId = null;
    gameState = 'start';
    appMode = 'lobby';
    stopPolling();
    render();
    loadRooms();
}

// ── MULTIPLAYER LOGIC (SHEETS POLLING) ────────────────────────────────────────
async function syncRoomState() {
    if (isPolling || !currentRoomId) return;
    isPolling = true;

    const res = await sheetGet('getState', `&roomId=${currentRoomId}`);
    if (res && res.success) {
        if (res.status === 'finished' && gameState !== 'gameover') {
            currentRoomData.status = 'finished';
            stopPolling();
            render();
        } 
        else if (currentRoomData.status === 'waiting' && res.status === 'playing') {
            currentRoomData.status = 'playing';
            currentRoomData.player2 = res.player2;
            render();
        }
        
        const newStateStr = JSON.stringify(res.gameState);
        const oldStateStr = JSON.stringify(currentRoomData.gameState);
        
        if (newStateStr !== oldStateStr) {
            currentRoomData.gameState = res.gameState;
            syncLocalStateFromData(res.gameState);
            render();
        }
    }
    isPolling = false;
}

function syncLocalStateFromData(gState) {
    if (!gState) return;
    playerDeck   = isPlayer1 ? (gState.player1_deck ?? []) : (gState.player2_deck ?? []);
    cpuDeck      = isPlayer1 ? (gState.player2_deck ?? []) : (gState.player1_deck ?? []);
    tiedCards    = gState.tied_cards ?? [];
    turn         = gState.current_turn === currentProfile.id ? 'player' : 'cpu';
    gameState    = gState.game_phase;
    selectedStat = gState.selected_stat ?? null;

    const rw = gState.round_winner;
    if (!rw)                 roundWinner = null;
    else if (rw === 'draw')  roundWinner = 'draw';
    else if (rw === 'player1') roundWinner = isPlayer1 ? 'player' : 'cpu';
    else                     roundWinner = isPlayer1 ? 'cpu'    : 'player';

    // Para de fazer requisições de polling se o jogo terminou
    if (gameState === 'gameover') {
        stopPolling();
        const playerWon = isOfflineMode ? playerDeck.length > 0 : (isPlayer1 ? playerDeck.length > cpuDeck.length : cpuDeck.length > playerDeck.length);
        playSfx(playerWon ? 'victory' : 'defeat');
        recordMatchEnd(playerWon);
    }
}

async function mpHandleStatSelect(statKey) {
    if (!currentRoomId || gameState !== 'playing' || turn !== 'player') return;
    playSfx('click'); playSfx('tick');
    
    sessionStats.chosenStatsCounts[statKey]++;
    selectedStat = statKey;
    gameState    = 'resolving';
    render(); 

    currentRoomData.gameState.selected_stat = statKey;
    currentRoomData.gameState.game_phase = 'resolving';
    
    await sheetPost({ action: 'updateState', roomId: currentRoomId, gameState: currentRoomData.gameState });
    setTimeout(() => mpResolveRound(statKey), 4000);
}

async function mpResolveRound(statKey) {
    if (!currentRoomId) return;
    stopSfx('tick'); // Para o som de contagem regressiva/ticking
    playSfx('flip');
    sessionStats.roundsPlayed++;
    const gState = currentRoomData.gameState;
    const myCard  = isPlayer1 ? gState.player1_deck[0] : gState.player2_deck[0];
    const oppCard = isPlayer1 ? gState.player2_deck[0] : gState.player1_deck[0];
    
    if (myCard) sessionStats.materialsDiscovered.add(myCard.id);
    if (oppCard) sessionStats.materialsDiscovered.add(oppCard.id);

    const myVal   = myCard.stats[statKey];
    const oppVal  = oppCard.stats[statKey];
    const isLowerBetter = statKey === 'cost';

    let winner;
    if (myVal === oppVal) {
        winner = 'draw';
        playSfx('draw');
        sessionStats.roundsDrawn++;
    } else {
        const iWin = isLowerBetter ? myVal < oppVal : myVal > oppVal;
        winner = iWin ? (isPlayer1 ? 'player1' : 'player2') : (isPlayer1 ? 'player2' : 'player1');
        playSfx(iWin ? 'win' : 'lose');
        
        if (iWin) {
            sessionStats.roundsWon++;
        } else {
            sessionStats.roundsLost++;
        }
    }

    gState.game_phase = 'result';
    gState.round_winner = winner;
    await sheetPost({ action: 'updateState', roomId: currentRoomId, gameState: gState });
    syncLocalStateFromData(gState);
    render();
}

async function mpNextRound() {
    if (!currentRoomId || gameState !== 'result') return;
    const gState = currentRoomData.gameState;
    const rw = gState.round_winner;
    
    const canTrigger = rw === 'draw' ? isPlayer1 : (rw === 'player1' ? isPlayer1 : !isPlayer1);
    if (!canTrigger) return;

    playSfx('click');
    const p1Deck = [...gState.player1_deck];
    const p2Deck = [...gState.player2_deck];
    let tied     = [...gState.tied_cards];

    const p1Card = p1Deck.shift();
    const p2Card = p2Deck.shift();
    
    let newTied  = tied;

    if (rw === 'player1') {
        p1Deck.push(p1Card, p2Card, ...tied);
        newTied  = [];
    } else if (rw === 'player2') {
        p2Deck.push(p2Card, p1Card, ...tied);
        newTied  = [];
    } else {
        newTied = [...tied, p1Card, p2Card]; 
    }

    const isGameOver = p1Deck.length === 0 || p2Deck.length === 0;
    
    gState.player1_deck = p1Deck;
    gState.player2_deck = p2Deck;
    gState.tied_cards = newTied;
    
    if(rw === 'player1' && isPlayer1) gState.current_turn = currentProfile.id;
    if(rw === 'player2' && !isPlayer1) gState.current_turn = currentProfile.id;

    gState.game_phase = isGameOver ? 'gameover' : 'playing';
    gState.round_winner = null;
    gState.selected_stat = null;

    let status = isGameOver ? 'finished' : 'playing';

    await sheetPost({ action: 'updateState', roomId: currentRoomId, gameState: gState, status: status });
    syncLocalStateFromData(gState);
    render();
}

// ── LÓGICA OFFLINE / CPU ──────────────────────────────────────────────────────
function startGame() {
    playSfx('click');
    sessionStats.matchesPlayed++;
    sessionStats.offlineMatches++;
    isMatchRecorded = false;
    const shuffled = [...MASTER_DECK].sort(() => Math.random() - 0.5);
    const selected = shuffled.slice(0, 10);
    playerDeck   = selected.slice(0, 5);
    cpuDeck      = selected.slice(5, 10);
    gameState    = 'playing';
    turn         = 'player';
    selectedStat = null;
    roundWinner  = null;
    tiedCards    = [];
    render();
}

function handleStatSelect(statKey) {
    if (gameState !== 'playing' || turn !== 'player') return;
    playSfx('click');
    sessionStats.chosenStatsCounts[statKey]++;
    selectedStat = statKey;
    gameState    = 'resolving';
    playSfx('tick');
    render();
    setTimeout(() => resolveRound(statKey), 6000);
}

function resolveRound(statKey) {
    stopSfx('tick'); // Para o som de contagem regressiva/ticking
    playSfx('flip');
    sessionStats.roundsPlayed++;
    
    if (playerDeck[0]) sessionStats.materialsDiscovered.add(playerDeck[0].id);
    if (cpuDeck[0]) sessionStats.materialsDiscovered.add(cpuDeck[0].id);

    const pVal = playerDeck[0].stats[statKey];
    const cVal = cpuDeck[0].stats[statKey];
    const isLowerBetter = statKey === 'cost';
    if (pVal === cVal) {
        roundWinner = 'draw'; 
        playSfx('draw');
        sessionStats.roundsDrawn++;
    } else if (isLowerBetter) {
        roundWinner = pVal < cVal ? 'player' : 'cpu';
        playSfx(roundWinner === 'player' ? 'win' : 'lose');
        if (roundWinner === 'player') {
            sessionStats.roundsWon++;
        } else {
            sessionStats.roundsLost++;
        }
    } else {
        roundWinner = pVal > cVal ? 'player' : 'cpu';
        playSfx(roundWinner === 'player' ? 'win' : 'lose');
        if (roundWinner === 'player') {
            sessionStats.roundsWon++;
        } else {
            sessionStats.roundsLost++;
        }
    }
    gameState = 'result';
    render();
}

function nextRound() {
    playSfx('click');
    const pCard = playerDeck.shift();
    const cCard = cpuDeck.shift();
    if (roundWinner === 'player')   { playerDeck.push(pCard, cCard, ...tiedCards); tiedCards = []; turn = 'player'; }
    else if (roundWinner === 'cpu') { cpuDeck.push(cCard, pCard, ...tiedCards);   tiedCards = []; turn = 'cpu';    }
    else                            { tiedCards.push(pCard, cCard); }
    selectedStat = null;
    roundWinner  = null;
    if (playerDeck.length === 0 || cpuDeck.length === 0) {
        gameState = 'gameover';
        const playerWon = playerDeck.length > 0;
        playSfx(playerWon ? 'victory' : 'defeat');
        recordMatchEnd(playerWon);
    } else {
        gameState = 'playing';
        if (turn === 'cpu') setTimeout(cpuPlayRound, 5000);
    }
    render();
}

function cpuPlayRound() {
    if (gameState !== 'playing' || turn !== 'cpu' || cpuDeck.length === 0) return;
    const card = cpuDeck[0];
    let bestStat = 'maxTemp', maxRel = -1;
    const maxPossibles = { lifetime: 100, cost: 100, impact: 100, resistance: 100, maxTemp: 4000 };
    Object.keys(card.stats).forEach(stat => {
        const val = stat === 'cost' ? 100 - card.stats[stat] : card.stats[stat];
        const rel = val / maxPossibles[stat];
        if (rel > maxRel) { maxRel = rel; bestStat = stat; }
    });
    selectedStat = bestStat;
    gameState    = 'resolving';
    playSfx('tick');
    render();
    setTimeout(() => resolveRound(bestStat), 4000);
}

const SOUNDS_BASE_URL = 'https://raw.githubusercontent.com/GlauberLASantiago/super-trunfo-materiais/main/sounds/';
const SFX_URLS = {
    click: SOUNDS_BASE_URL + 'sfx_click.mp3',
    tick: SOUNDS_BASE_URL + 'sfx_tick.mp3',
    win: SOUNDS_BASE_URL + 'sfx_win_round.mp3',
    lose: SOUNDS_BASE_URL + 'sfx_lose_round.mp3',
    draw: SOUNDS_BASE_URL + 'sfx_draw.mp3',
    flip: SOUNDS_BASE_URL + 'sfx_flip.mp3',
    victory: SOUNDS_BASE_URL + 'sfx_victory.mp3',
    defeat: SOUNDS_BASE_URL + 'sfx_defeat.mp3'
};

const MUSIC_TRACKS = [
    { name: { pt: "Lobby", en: "Lobby" }, file: 'music_lobby.mp3' },
    { name: { pt: "Tecnologia", en: "Technology" }, file: 'music_game_ambient.mp3' },
    { name: { pt: "Retrô", en: "Retro" }, file: 'music_game_retro.mp3' },
    { name: { pt: "Tensão", en: "Tension" }, file: 'music_game_tension.mp3' }
];

let musicAudio = null;
let musicPlaying = false;
let musicTrackIndex = 0;
let globalVolume = 0.5;

// Restaura volume salvo se houver
if (localStorage.getItem('super-trunfo-volume') !== null) {
    globalVolume = parseFloat(localStorage.getItem('super-trunfo-volume'));
}

let activeSfx = {};

function playSfx(type) {
    try {
        if (type === 'click') {
            sessionStats.clicksCount++;
        }
        const url = SFX_URLS[type];
        if (!url) return;
        
        // Se já houver um som desse tipo tocando, encerra ele imediatamente
        if (activeSfx[type]) {
            activeSfx[type].pause();
            activeSfx[type] = null;
        }
        
        const audio = new Audio(url);
        audio.volume = globalVolume * 0.8;
        activeSfx[type] = audio;
        
        // Limpa a referência ao encerrar o áudio para liberar memória
        audio.onended = () => {
            if (activeSfx[type] === audio) {
                activeSfx[type] = null;
            }
        };
        
        audio.play().catch(e => console.log("SFX autoplay blocked:", e));
    } catch (e) {
        console.error(e);
    }
}

function stopSfx(type) {
    if (activeSfx[type]) {
        activeSfx[type].pause();
        activeSfx[type] = null;
    }
}

function toggleMusic() {
    playSfx('click');
    if (musicPlaying) {
        pauseMusic();
    } else {
        playMusic();
    }
}

function playMusic() {
    try {
        if (!musicAudio) {
            loadMusicTrack(musicTrackIndex);
        }
        musicAudio.play().then(() => {
            musicPlaying = true;
            updateAudioUI();
        }).catch(e => {
            console.log("Music autoplay blocked:", e);
        });
    } catch (e) {
        console.error(e);
    }
}

function pauseMusic() {
    if (musicAudio) {
        musicAudio.pause();
    }
    musicPlaying = false;
    updateAudioUI();
}

function loadMusicTrack(index) {
    if (musicAudio) {
        musicAudio.pause();
        musicAudio = null;
    }
    
    musicTrackIndex = index;
    const track = MUSIC_TRACKS[musicTrackIndex];
    musicAudio = new Audio(SOUNDS_BASE_URL + track.file);
    musicAudio.loop = true;
    musicAudio.volume = globalVolume * 0.5;
    
    if (musicPlaying) {
        musicAudio.play().catch(e => console.log(e));
    }
    updateAudioUI();
}

function nextMusic() {
    let nextIndex = (musicTrackIndex + 1) % MUSIC_TRACKS.length;
    if (!musicPlaying) musicPlaying = true;
    loadMusicTrack(nextIndex);
    playSfx('click');
}

function changeVolume(val) {
    globalVolume = parseFloat(val);
    if (musicAudio) {
        musicAudio.volume = globalVolume * 0.5;
    }
    localStorage.setItem('super-trunfo-volume', globalVolume);
}

function updateAudioUI() {
    const icon = document.getElementById('icon-music');
    const btn = document.getElementById('btn-music');
    const trackSpan = document.getElementById('track-name');
    
    if (!icon || !btn) return;
    
    if (musicPlaying) {
        icon.setAttribute('data-lucide', 'volume-2');
        btn.className = 'p-2 rounded-full text-[#8DC63F] hover:text-green-400 transition-colors';
    } else {
        icon.setAttribute('data-lucide', 'volume-x');
        btn.className = 'p-2 rounded-full text-slate-500 hover:text-slate-300 transition-colors';
    }
    
    if (trackSpan) {
        trackSpan.innerText = MUSIC_TRACKS[musicTrackIndex].name[currentLang];
    }
    
    lucide.createIcons();
}

function toggleInfo() {
    const modal = document.getElementById('info-modal'); const content = document.getElementById('info-modal-content');
    if (modal.classList.contains('hidden')) { modal.classList.remove('hidden'); setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); }, 10); playSfx('click'); }
    else { modal.classList.add('opacity-0'); content.classList.add('scale-95'); setTimeout(() => modal.classList.add('hidden'), 300); playSfx('click'); }
}

let particlesArray = []; let canvas, ctx;
function initParticles() { canvas = document.getElementById('particles'); ctx = canvas.getContext('2d'); resizeCanvas(); window.addEventListener('resize', resizeCanvas); particlesArray = []; const numParticles = Math.min(window.innerWidth / 12, 120); for (let i = 0; i < numParticles; i++) { particlesArray.push(new Particle()); } }
function resizeCanvas() { if(canvas) { canvas.width = window.innerWidth; canvas.height = window.innerHeight; } }
class Particle {
    constructor() { this.x = Math.random() * window.innerWidth; this.y = Math.random() * window.innerHeight; this.size = Math.random() * 3 + 1; this.speedX = Math.random() * 1 - 0.5; this.speedY = Math.random() * 1 - 0.5; const colors = ['rgba(255, 165, 0, 0.4)', 'rgba(141, 198, 63, 0.4)', 'rgba(65, 105, 225, 0.4)', 'rgba(200, 200, 200, 0.4)']; this.color = colors[Math.floor(Math.random() * colors.length)]; }
    update() { this.x += this.speedX; this.y += this.speedY; if (this.size > 0.2) this.size -= 0.005; if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height || this.size <= 0.2) { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 3 + 1; } }
    draw() { ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
}
function animateParticles() { if(!ctx || !canvas) return; ctx.clearRect(0, 0, canvas.width, canvas.height); for (let i = 0; i < particlesArray.length; i++) { particlesArray[i].update(); particlesArray[i].draw(); } connectParticles(); requestAnimationFrame(animateParticles); }
function connectParticles() { let opacityValue = 1; for (let a = 0; a < particlesArray.length; a++) { for (let b = a; b < particlesArray.length; b++) { let dx = particlesArray[a].x - particlesArray[b].x; let dy = particlesArray[a].y - particlesArray[b].y; let distance = dx * dx + dy * dy; if (distance < 12000) { opacityValue = 1 - (distance / 12000); ctx.strokeStyle = `rgba(141, 198, 63, ${opacityValue * 0.15})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(particlesArray[a].x, particlesArray[a].y); ctx.lineTo(particlesArray[b].x, particlesArray[b].y); ctx.stroke(); } } } }

function toggleCertModal() {
    const modal = document.getElementById('cert-modal');
    const content = document.getElementById('cert-modal-content');
    if (!modal || !content) return;
    
    if (modal.classList.contains('hidden')) {
        modal.classList.remove('hidden');
        setTimeout(() => {
            modal.classList.remove('opacity-0');
            content.classList.remove('scale-95');
        }, 10);
        playSfx('click');
    } else {
        modal.classList.add('opacity-0');
        content.classList.add('scale-95');
        setTimeout(() => modal.classList.add('hidden'), 300);
        playSfx('click');
    }
}

// Controle de Instalação do PWA
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    const installBtn = document.getElementById('btn-install-pwa');
    if (installBtn) {
        installBtn.classList.remove('hidden');
    }
});

async function installPWA() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    console.log(`Resultado da instalação: ${outcome}`);
    deferredPrompt = null;
    const installBtn = document.getElementById('btn-install-pwa');
    if (installBtn) {
        installBtn.classList.add('hidden');
    }
}

window.addEventListener('appinstalled', (evt) => {
    console.log('PWA instalado com sucesso!');
    const installBtn = document.getElementById('btn-install-pwa');
    if (installBtn) {
        installBtn.classList.add('hidden');
    }
});

// Registra o Service Worker para PWA
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker registrado:', reg.scope))
            .catch(err => console.log('Erro ao registrar Service Worker:', err));
    });
}
