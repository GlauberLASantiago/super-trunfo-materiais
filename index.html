</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col overflow-x-hidden selection:bg-blue-500 selection:text-white relative">

    <canvas id="particles" class="fixed inset-0 pointer-events-none z-0 opacity-30"></canvas>

    <div class="absolute top-4 right-4 z-50 flex gap-3 items-center">
        <div id="user-header" class="hidden"></div>

        </button>

            <button onclick="toggleLang('en')" id="btn-en" class="px-3 py-1 rounded-full font-bold text-sm bg-transparent text-slate-300 transition-opacity hover:bg-slate-700">EN</button>

    <div id="info-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-slate-800 border border-[#8DC63F] rounded-2xl p-6 md:p-8 max-w-3xl w-full text-white shadow-2xl relative transform scale-95 transition-transform duration-300" id="info-modal-content">
            <button onclick="toggleInfo()" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-700/50 rounded-full p-1"><i data-lucide="x" class="w-6 h-6"></i></button>
            <h2 id="modal-title" class="text-3xl font-black text-[#8DC63F] mb-6 flex items-center gap-2"><i data-lucide="graduation-cap"></i> <span id="text-info-title">Sobre o Jogo</span></h2>
            <div class="space-y-6 text-sm md:text-base text-slate-300 max-h-[70vh] overflow-y-auto pr-2">
                <div>
                    <h3 class="text-white font-bold text-xl mb-2 flex items-center gap-2 text-blue-400"><i data-lucide="gamepad-2"></i> <span id="text-rules-title">Como Funciona</span></h3>
                    <p id="text-rules-desc" class="leading-relaxed"></p>
                </div>
                <div>
                    <h3 class="text-white font-bold text-xl mb-2 flex items-center gap-2 text-emerald-400"><i data-lucide="book-open"></i> <span id="text-pedagogy-title">Objetivo Pedagógico</span></h3>
                    <p id="text-pedagogy-desc" class="leading-relaxed"></p>

    </div>

        <span class="text-[10px] uppercase tracking-widest text-slate-400 font-bold">Desenvolvido para</span>
        <span class="text-sm font-black text-[#8DC63F] tracking-wider drop-shadow-md">DEMa - UFSCar</span>
    </footer>

    <div id="app" class="flex-1 flex flex-col p-4 w-full max-w-7xl mx-auto relative z-10"></div>

<script>

        nextRound: "Next Round",

        playOffline: "Play vs CPU (offline)",
        waitingTitle: "Waiting for Opponent...",
        waitingDesc: "Share the room code with a friend or wait for someone to join.",

};

let currentLang = 'pt';
const t = (key, nestedKey) => nestedKey ? (i18n[currentLang][key]?.[nestedKey] ?? nestedKey) : (i18n[currentLang][key] ?? key);

// --- 50 CARDS MASTER DECK ---
const MASTER_DECK = [
    { id: 1, icon: "flame", color: "bg-orange-500", stats: { lifetime: 20, cost: 11, impact: 50, resistance: 14, maxTemp: 400 }, title: { pt: "Aquecedor de Sauna (Cerâmica)", en: "Ceramic Sauna Heater" }, type: { pt: "Cerâmica Avançada", en: "Advanced Ceramic" }, desc: { pt: "Elementos cerâmicos garantem eficiência energética e durabilidade ao emitir calor.", en: "Ceramic elements ensure energy efficiency and durability by emitting heat." } },
    { id: 2, icon: "zap", color: "bg-yellow-500", stats: { lifetime: 100, cost: 45, impact: 93, resistance: 82, maxTemp: 300 }, title: { pt: "Isolador de Porcelana", en: "Porcelain Insulator" }, type: { pt: "Cerâmica Estrutural", en: "Structural Ceramic" }, desc: { pt: "Isolamento elétrico resistente a intempéries que suporta altas tensões nas linhas de energia.", en: "Weather-resistant electrical insulation that withstands high voltages on power lines." } },
    { id: 11, icon: "settings", color: "bg-gray-400", stats: { lifetime: 98, cost: 60, impact: 80, resistance: 88, maxTemp: 1668 }, title: { pt: "Implante de Titânio", en: "Titanium Implant" }, type: { pt: "Liga Metálica", en: "Metal Alloy" }, desc: { pt: "Liga Ti-6Al-4V amplamente usada em ortopedia pela sua alta relação força-peso e biocompatibilidade.", en: "Ti-6Al-4V alloy widely used in orthopedics for its high strength-to-weight ratio." } },
    { id: 13, icon: "car", color: "bg-zinc-500", stats: { lifetime: 60, cost: 30, impact: 90, resistance: 70, maxTemp: 1500 }, title: { pt: "Chassi de Aço (DP)", en: "Steel Chassis (DP)" }, type: { pt: "Aço Avançado", en: "Advanced Steel" }, desc: { pt: "Aço Dual Phase que absorve energia em batidas automobilísticas mantendo a integridade.", en: "Dual Phase steel that absorbs energy in car crashes while maintaining integrity." } },
    { id: 22, icon: "package", color: "bg-cyan-500", stats: { lifetime: 10, cost: 5, impact: 100, resistance: 10, maxTemp: 260 }, title: { pt: "Garrafa PET", en: "PET Bottle" }, type: { pt: "Termoplástico", en: "Thermoplastic" }, desc: { pt: "Polietileno tereftalato, onipresente em embalagens por ser leve, transparente e reciclável.", en: "Ubiquitous in packaging for being lightweight, transparent, and recyclable." } },
    { id: 31, icon: "wind", color: "bg-black", stats: { lifetime: 55, cost: 80, impact: 35, resistance: 90, maxTemp: 350 }, title: { pt: "Chassi de Fibra de Carbono", en: "Carbon Fiber Chassis" }, type: { pt: "Compósito Polimérico", en: "Polymer Composite" }, desc: { pt: "Fibras de carbono em matriz de epóxi oferecem resistência de aço com fração do peso.", en: "Carbon fibers in an epoxy matrix offer steel strength at a fraction of the weight." } },
    { id: 36, icon: "shield", color: "bg-stone-500", stats: { lifetime: 100, cost: 15, impact: 90, resistance: 85, maxTemp: 1000 }, title: { pt: "Concreto Armado", en: "Reinforced Concrete" }, type: { pt: "Compósito Macro", en: "Macro Composite" }, desc: { pt: "A união do concreto (resistência à compressão) com o aço (resistência à tração).", en: "The union of concrete (compressive strength) with steel (tensile strength)." } },
    { id: 41, icon: "cpu", color: "bg-gray-800", stats: { lifetime: 65, cost: 75, impact: 100, resistance: 50, maxTemp: 1414 }, title: { pt: "Wafer de Silício", en: "Silicon Wafer" }, type: { pt: "Semicondutor", en: "Semiconductor" }, desc: { pt: "Cristal ultra-puro dopado que forma os transistores do cérebro de todo computador.", en: "Ultra-pure doped crystal that forms the transistors of every computer's brain." } },
    { id: 45, icon: "layers", color: "bg-zinc-900", stats: { lifetime: 75, cost: 95, impact: 5, resistance: 98, maxTemp: 3500 }, title: { pt: "Folha de Grafeno", en: "Graphene Sheet" }, type: { pt: "Nanomaterial de Carbono", en: "Carbon Nanomaterial" }, desc: { pt: "Camada atômica única de carbono com condutividade e força incomparáveis.", en: "Single atomic layer of carbon with unmatched conductivity and strength." } },
    { id: 50, icon: "cpu", color: "bg-indigo-900", stats: { lifetime: 30, cost: 80, impact: 30, resistance: 45, maxTemp: 80 }, title: { pt: "Tinta de Prata Condutiva", en: "Conductive Silver Ink" }, type: { pt: "Compósito Funcional", en: "Functional Composite" }, desc: { pt: "Nanopartículas de prata em matriz polimérica para imprimir circuitos flexíveis e RFID.", en: "Silver nanoparticles in a polymer matrix for printing flexible circuits and RFID." } }
    // OBS: Resumi o baralho aqui para caber no código, mas cole o seu MASTER_DECK de 50 cartas completo que você já tinha.
];

// ── ESTADO DA APLICAÇÃO ───────────────────────────────────────────────────────
let appMode      = 'auth'; // auth | lobby | game
let currentProfile = null;
let currentRoomId = null;
let currentRoomData = null; // Guarda o estado recebido do Google Sheets
let isPlayer1    = false;
let isOfflineMode = false;
let availableRooms = [];

// ── ESTADO DO JOGO ────────────────────────────────────────────────────────────
let gameState  = 'start'; // start | playing | resolving | result | gameover
let playerDeck = [];
let cpuDeck    = [];
let tiedCards  = [];
let turn       = 'player';
let selectedStat = null;
let roundWinner  = null;

// Polling do Google Sheets
let pollingInterval = null;
let isPolling = false;

// ── INICIALIZAÇÃO ─────────────────────────────────────────────────────────────
function init() {
    updateInfoTexts();
    initParticles();
    animateParticles();
    render();
}

function toggleLang(lang) {
    currentLang = lang;
    document.getElementById('btn-pt').className = currentLang === 'pt' ? 'px-3 py-1 rounded-full font-bold text-sm bg-blue-600 text-white transition-opacity' : 'px-3 py-1 rounded-full font-bold text-sm bg-transparent text-slate-300 transition-opacity hover:bg-slate-700';
    document.getElementById('btn-en').className = currentLang === 'en' ? 'px-3 py-1 rounded-full font-bold text-sm bg-blue-600 text-white transition-opacity' : 'px-3 py-1 rounded-full font-bold text-sm bg-transparent text-slate-300 transition-opacity hover:bg-slate-700';
    updateInfoTexts();
    render();
}

function updateInfoTexts() {
    const el = (id) => document.getElementById(id);
    if (el('text-info-title')) {
        el('text-info-title').innerText     = t('infoTitle');
        el('text-rules-title').innerText    = t('rulesTitle');
        el('text-rules-desc').innerText     = t('rulesDesc');
        el('text-pedagogy-title').innerText = t('pedagogyTitle');
        el('text-pedagogy-desc').innerText  = t('pedagogyDesc');
    }
}

function _showToast(msg) {
    const existing = document.getElementById('_toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.id = '_toast';
    toast.textContent = msg;
    toast.className = 'fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-red-800 border border-red-600 text-white text-sm font-semibold px-5 py-3 rounded-xl shadow-xl transition-opacity duration-500';
    document.body.appendChild(toast);
    setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 3000);
}

// ── COMUNICAÇÃO GOOGLE SHEETS ─────────────────────────────────────────────────
async function sheetPost(data) {
    try {
        const response = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // text/plain evita bloqueio de CORS
            body: JSON.stringify(data)
        });
        return await response.json();
    } catch (err) {
        console.error("Erro na comunicação com Sheets:", err);
        return { success: false };
    }
}

async function sheetGet(action, extraParams = "") {
    try {
        const response = await fetch(`${APPS_SCRIPT_URL}?action=${action}${extraParams}`);
        return await response.json();
    } catch (err) {
        console.error("Erro no GET do Sheets:", err);
        return { success: false };
    }
}

function startPolling() {
    if (pollingInterval) clearInterval(pollingInterval);
    pollingInterval = setInterval(syncRoomState, 3000); // Checa o Sheets a cada 3 segundos
}

function stopPolling() {
    if (pollingInterval) clearInterval(pollingInterval);
    isPolling = false;
}

// ── AUTENTICAÇÃO SIMPLES ──────────────────────────────────────────────────────
function enterGame() {
    const nameInput = document.getElementById('playerName').value.trim();
    if (!nameInput) {
        _showToast(currentLang === 'pt' ? 'Digite um nome válido!' : 'Enter a valid name!');
        return;
    }
    playSfx('click');
    currentProfile = {
        id: 'user_' + Math.random().toString(36).substr(2, 9),
        nickname: nameInput.substring(0, 20)
    };
    appMode = 'lobby';
    render();
    loadRooms();
}

function signOut() {
    playSfx('click');
    if (currentRoomId) leaveRoom(true);
    currentProfile = null;
    isOfflineMode  = false;
    appMode = 'auth';
    render();
}

// ── LOBBY ─────────────────────────────────────────────────────────────────────
async function loadRooms() {
    if (!currentProfile) return;
    const loadingBtn = document.getElementById('btn-refresh');
    if(loadingBtn) loadingBtn.classList.add('animate-spin');

    const res = await sheetGet('getRooms');
    if (res && res.success) {
        availableRooms = res.rooms || [];
    }
    if (appMode === 'lobby') render();
}

async function createRoom() {
    if (APPS_SCRIPT_URL === 'SUA_URL_DO_APPS_SCRIPT_AQUI') {
        _showToast('Configure a URL do Google Sheets no código-fonte.');
        return;
    }
    playSfx('click');
    appMode = 'loading';
    render();

    const shuffled = [...MASTER_DECK].sort(() => Math.random() - 0.5);
    const selected = shuffled.slice(0, 10);

    const initialGameState = {
        player1_deck: selected.slice(0, 5),
        player2_deck: selected.slice(5, 10),
        tied_cards: [],
        current_turn: currentProfile.id,
        game_phase: 'playing',
        selected_stat: null,
        round_winner: null,
        winner_id: null
    };

    const res = await sheetPost({
        action: 'createRoom',
        player1: currentProfile.nickname,
        gameState: initialGameState
    });

    if (res && res.success) {
        isPlayer1 = true;
        currentRoomId = res.roomId;
        currentRoomData = { status: 'waiting', player2: '', gameState: initialGameState };
        syncLocalStateFromData(initialGameState);
        appMode = 'game';
        startPolling();
        render();
    } else {
        appMode = 'lobby';
        _showToast('Erro ao criar sala.');
        render();
    }
}

async function joinRoom(roomId) {
    playSfx('click');
    appMode = 'loading';
    render();

    const res = await sheetPost({
        action: 'joinRoom',
        roomId: roomId,
        player2: currentProfile.nickname
    });

    if (res && res.success) {
        isPlayer1 = false;
        currentRoomId = roomId;
        currentRoomData = { status: 'playing', player2: currentProfile.nickname, gameState: res.gameState };
        syncLocalStateFromData(res.gameState);
        appMode = 'game';
        startPolling();
        render();
    } else {
        appMode = 'lobby';
        _showToast(res.error || 'Erro ao entrar na sala.');
        await loadRooms();
        render();
    }
}

async function leaveRoom(silent = false) {
    stopPolling();
    if (currentRoomId && currentRoomData && currentRoomData.status !== 'finished') {
        // Tenta avisar o banco que a partida acabou
        sheetPost({ action: 'updateState', roomId: currentRoomId, gameState: currentRoomData.gameState, status: 'finished' });
    }
    currentRoomId = null;
    currentRoomData = null;
    isPlayer1 = false;
    
    if (!silent) {
        appMode = 'lobby';
        render();
        await loadRooms();
    }
}

function playOffline() {
    playSfx('click');
    isOfflineMode = true;
    currentRoomId = null;
    stopPolling();
    gameState = 'start';
    playerDeck = []; cpuDeck = []; tiedCards = [];
    turn = 'player'; selectedStat = null; roundWinner = null;
    appMode = 'game';
    render();
}

function goToLobby() {
    playSfx('click');
    isOfflineMode = false;
    currentRoomId = null;
    gameState = 'start';
    appMode = 'lobby';
    stopPolling();
    render();
    loadRooms();
}

// ── MULTIPLAYER LOGIC (SHEETS POLLING) ────────────────────────────────────────
async function syncRoomState() {
    if (isPolling || !currentRoomId) return;
    isPolling = true;

    const res = await sheetGet('getState', `&roomId=${currentRoomId}`);
    if (res && res.success) {
        // Se a sala acabou ou o oponente fugiu
        if (res.status === 'finished' && gameState !== 'gameover') {
            currentRoomData.status = 'finished';
            stopPolling();
            render();
        } 
        // Se o oponente entrou
        else if (currentRoomData.status === 'waiting' && res.status === 'playing') {
            currentRoomData.status = 'playing';
            currentRoomData.player2 = res.player2;
            render();
        }
        
        // Atualiza a UI se o estado mudou
        const newStateStr = JSON.stringify(res.gameState);
        const oldStateStr = JSON.stringify(currentRoomData.gameState);
        
        if (newStateStr !== oldStateStr) {
            currentRoomData.gameState = res.gameState;
            syncLocalStateFromData(res.gameState);
            render();
        }
    }
    isPolling = false;
}

function syncLocalStateFromData(gState) {
    if (!gState) return;
    playerDeck   = isPlayer1 ? (gState.player1_deck ?? []) : (gState.player2_deck ?? []);
    cpuDeck      = isPlayer1 ? (gState.player2_deck ?? []) : (gState.player1_deck ?? []);
    tiedCards    = gState.tied_cards ?? [];
    turn         = gState.current_turn === currentProfile.id ? 'player' : 'cpu';
    gameState    = gState.game_phase;
    selectedStat = gState.selected_stat ?? null;

    const rw = gState.round_winner;
    if (!rw)                 roundWinner = null;
    else if (rw === 'draw')  roundWinner = 'draw';
    else if (rw === 'player1') roundWinner = isPlayer1 ? 'player' : 'cpu';
    else                     roundWinner = isPlayer1 ? 'cpu'    : 'player';
}

async function mpHandleStatSelect(statKey) {
    if (!currentRoomId || gameState !== 'playing' || turn !== 'player') return;
    playSfx('click'); playSfx('tick');
    
    selectedStat = statKey;
    gameState    = 'resolving';
    render(); // UI imediata

    currentRoomData.gameState.selected_stat = statKey;
    currentRoomData.gameState.game_phase = 'resolving';
    
    await sheetPost({ action: 'updateState', roomId: currentRoomId, gameState: currentRoomData.gameState });
    setTimeout(() => mpResolveRound(statKey), 2000);
}

async function mpResolveRound(statKey) {
    if (!currentRoomId) return;
    const gState = currentRoomData.gameState;
    const myCard  = isPlayer1 ? gState.player1_deck[0] : gState.player2_deck[0];
    const oppCard = isPlayer1 ? gState.player2_deck[0] : gState.player1_deck[0];
    const myVal   = myCard.stats[statKey];
    const oppVal  = oppCard.stats[statKey];
    const isLowerBetter = statKey === 'cost';

    let winner;
    if (myVal === oppVal) {
        winner = 'draw';
        playSfx('draw');
    } else {
        const iWin = isLowerBetter ? myVal < oppVal : myVal > oppVal;
        winner = iWin ? (isPlayer1 ? 'player1' : 'player2') : (isPlayer1 ? 'player2' : 'player1');
        playSfx(iWin ? 'win' : 'lose');
    }

    gState.game_phase = 'result';
    gState.round_winner = winner;
    await sheetPost({ action: 'updateState', roomId: currentRoomId, gameState: gState });
    syncLocalStateFromData(gState);
    render();
}

async function mpNextRound() {
    if (!currentRoomId || gameState !== 'result') return;
    const gState = currentRoomData.gameState;
    const rw = gState.round_winner;
    
    const canTrigger = rw === 'draw' ? isPlayer1 : (rw === 'player1' ? isPlayer1 : !isPlayer1);
    if (!canTrigger) return;

    playSfx('click');
    const p1Deck = [...gState.player1_deck];
    const p2Deck = [...gState.player2_deck];
    let tied     = [...gState.tied_cards];

    const p1Card = p1Deck.shift();
    const p2Card = p2Deck.shift();

    // Se é o player 2 engatilhando, ele deve passar o turno da rede para ele mesmo continuar.
    // Lógica para saber de quem é o id
    const p1Id = isPlayer1 ? currentProfile.id : 'opp'; // Hack simples já que não temos o ID do opp salvos no local
    const p2Id = !isPlayer1 ? currentProfile.id : 'opp';
    
    let nextTurnId = gState.current_turn; 
    let newTied  = tied;

    if (rw === 'player1') {
        p1Deck.push(p1Card, p2Card, ...tied);
        newTied  = [];
        nextTurnId = isPlayer1 ? currentProfile.id : 'opp_id_placeholder'; // Simplificação, pois o turno é validado pelo ID
    } else if (rw === 'player2') {
        p2Deck.push(p2Card, p1Card, ...tied);
        newTied  = [];
        nextTurnId = !isPlayer1 ? currentProfile.id : 'opp_id_placeholder';
    } else {
        newTied = [...tied, p1Card, p2Card]; 
    }

    const isGameOver = p1Deck.length === 0 || p2Deck.length === 0;
    
    gState.player1_deck = p1Deck;
    gState.player2_deck = p2Deck;
    gState.tied_cards = newTied;
    // Truque: como no sheets não temos ids rígidos, podemos setar o turno verificando quem ganhou.
    if(rw === 'player1' && isPlayer1) gState.current_turn = currentProfile.id;
    if(rw === 'player2' && !isPlayer1) gState.current_turn = currentProfile.id;
    // (Se o outro ganhou, ele seta o turno dele quando resolver)

    gState.game_phase = isGameOver ? 'gameover' : 'playing';
    gState.round_winner = null;
    gState.selected_stat = null;

    let status = isGameOver ? 'finished' : 'playing';

    await sheetPost({ action: 'updateState', roomId: currentRoomId, gameState: gState, status: status });
    syncLocalStateFromData(gState);
    render();
}

// ── LÓGICA OFFLINE / CPU ──────────────────────────────────────────────────────
function startGame() {
    playSfx('click');
    const shuffled = [...MASTER_DECK].sort(() => Math.random() - 0.5);
    const selected = shuffled.slice(0, 10);
    playerDeck   = selected.slice(0, 5);
    cpuDeck      = selected.slice(5, 10);
    gameState    = 'playing';
    turn         = 'player';
    selectedStat = null;
    roundWinner  = null;
    tiedCards    = [];
    render();
}

function handleStatSelect(statKey) {
    if (gameState !== 'playing' || turn !== 'player') return;
    playSfx('click');
    selectedStat = statKey;
    gameState    = 'resolving';
    playSfx('tick');
    render();
    setTimeout(() => resolveRound(statKey), 2000);
}

function resolveRound(statKey) {
    const pVal = playerDeck[0].stats[statKey];
    const cVal = cpuDeck[0].stats[statKey];
    const isLowerBetter = statKey === 'cost';
    if (pVal === cVal) {
        roundWinner = 'draw'; playSfx('draw');
    } else if (isLowerBetter) {
        roundWinner = pVal < cVal ? 'player' : 'cpu';
        playSfx(roundWinner === 'player' ? 'win' : 'lose');
    } else {
        roundWinner = pVal > cVal ? 'player' : 'cpu';
        playSfx(roundWinner === 'player' ? 'win' : 'lose');
    }
    gameState = 'result';
    render();
}

function nextRound() {
    playSfx('click');
    const pCard = playerDeck.shift();
    const cCard = cpuDeck.shift();
    if (roundWinner === 'player')   { playerDeck.push(pCard, cCard, ...tiedCards); tiedCards = []; turn = 'player'; }
    else if (roundWinner === 'cpu') { cpuDeck.push(cCard, pCard, ...tiedCards);   tiedCards = []; turn = 'cpu';    }
    else                            { tiedCards.push(pCard, cCard); }
    selectedStat = null;
    roundWinner  = null;
    if (playerDeck.length === 0 || cpuDeck.length === 0) {
        gameState = 'gameover';
    } else {
        gameState = 'playing';
        if (turn === 'cpu') setTimeout(cpuPlayRound, 1500);
    }
    render();
}

function cpuPlayRound() {
    if (gameState !== 'playing' || turn !== 'cpu' || cpuDeck.length === 0) return;
    const card = cpuDeck[0];
    let bestStat = 'maxTemp', maxRel = -1;
    const maxPossibles = { lifetime: 100, cost: 100, impact: 100, resistance: 100, maxTemp: 4000 };
    Object.keys(card.stats).forEach(stat => {
        const val = stat === 'cost' ? 100 - card.stats[stat] : card.stats[stat];
        const rel = val / maxPossibles[stat];
        if (rel > maxRel) { maxRel = rel; bestStat = stat; }
    });
    selectedStat = bestStat;
    gameState    = 'resolving';
    playSfx('tick');
    render();
    setTimeout(() => resolveRound(bestStat), 2000);
}

    return isPlayer1 ? currentRoomData.player2 : currentRoomData.gameState.player1_nickname || 'Adversário'; // (necessita salvar nome do p1 tb no JSON se quisermos puxar aqui)

    if (isOfflineMode) return true;
    if (!currentRoomData || !currentRoomData.gameState) return false;
    const rw = currentRoomData.gameState.round_winner;
    if (!rw) return false;
    return rw === 'draw' ? isPlayer1 : (rw === 'player1' ? isPlayer1 : !isPlayer1);

        <div class="w-64 md:w-72 h-[26rem] md:h-[28rem] bg-gradient-to-br from-blue-900 to-indigo-900 rounded-xl border-4 border-indigo-500 shadow-xl flex flex-col items-center justify-center relative overflow-hidden transition-all duration-300">

        </div>`;
    }
    const borderClass = isWinner === true  ? 'border-yellow-400 shadow-[0_0_20px_rgba(250,204,21,0.6)] scale-105' : isWinner === false ? 'border-gray-500 opacity-80' : 'border-[#8DC63F] shadow-lg';
    const statsRows = Object.keys(card.stats).map(key => {
        const isSel = selectedStat === key;
        const suffix = key === 'maxTemp' ? ' °C' : '';
        const clickAttr = isActive && statFn ? `onclick="${statFn(key)}"` : '';
        return `<div ${clickAttr} class="stat-row flex justify-between items-center px-4 py-2 flex-1 border-b border-blue-400/30 text-white ${isActive ? 'cursor-pointer' : ''} transition-colors ${isSel ? 'stat-selected shadow-inner' : ''}">
            <span>${t('stats', key)}</span><span class="font-bold">${card.stats[key]}${suffix}</span>
        </div>`;
    }).join('');

    return `
    <div class="w-64 md:w-72 h-[26rem] md:h-[28rem] bg-[#8DC63F] rounded-xl border-4 ${borderClass} flex flex-col overflow-hidden transition-all duration-300 relative select-none">
        <div class="h-[30%] relative flex items-center justify-center p-2">
            <div class="absolute inset-0 ${card.color} opacity-90"></div>
            <div class="relative z-10 text-center w-full px-1">
                <i data-lucide="${card.icon}" class="w-10 h-10 mx-auto text-white mb-1 drop-shadow-md"></i>
                <h2 class="font-bold text-white text-[0.95rem] leading-tight drop-shadow-md">${card.title[currentLang]}</h2>
                <p class="text-[0.65rem] text-white/80 mt-1 font-semibold tracking-wider uppercase">${card.type[currentLang]}</p>
            </div>
        </div>
        <div class="bg-[#4169E1] flex-1 flex flex-col text-sm border-t-2 border-[#2b4cba]">
            ${statsRows}
        </div>
        <div class="h-[25%] bg-[#3B5998] p-3 text-white text-xs overflow-y-auto leading-relaxed text-justify border-t-2 border-[#2b4cba]">
            ${card.desc[currentLang]}
        </div>
    </div>`;
}

// ================= Áudio & Partículas (MANTIDOS DO ORIGINAL) =================
let audioCtx; let musicNodes = []; let musicPlaying = false;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
function toggleMusic() {
    initAudio();
    if (musicPlaying) {
        musicPlaying = false; musicNodes.forEach(node => { try { node.stop(); } catch(e){} node.disconnect(); }); musicNodes = [];
        document.getElementById('icon-music').setAttribute('data-lucide', 'volume-x');
        document.getElementById('btn-music').classList.replace('text-[#8DC63F]', 'text-slate-400');
    } else {
        musicPlaying = true; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); const filter = audioCtx.createBiquadFilter();
        osc.type = 'sawtooth'; osc.frequency.value = 55; filter.type = 'lowpass'; filter.frequency.value = 400;
        const lfo = audioCtx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.2;
        const lfoPitchGain = audioCtx.createGain(); lfoPitchGain.gain.value = 5; const lfoFilterGain = audioCtx.createGain(); lfoFilterGain.gain.value = 150;
        lfo.connect(lfoPitchGain); lfoPitchGain.connect(osc.frequency); lfo.connect(lfoFilterGain); lfoFilterGain.connect(filter.frequency);
        gain.gain.value = 0.05; osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); lfo.start(); musicNodes.push(osc, lfo, gain, filter, lfoPitchGain, lfoFilterGain);
        document.getElementById('icon-music').setAttribute('data-lucide', 'volume-2');
        document.getElementById('btn-music').classList.replace('text-slate-400', 'text-[#8DC63F]');
    }
    lucide.createIcons();
}
function playSfx(type) {
    initAudio(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime;
    if (type === 'click') { osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.1); gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1); osc.start(now); osc.stop(now + 0.1); }
    else if (type === 'tick') { for (let i = 0; i < 4; i++) { const tOsc = audioCtx.createOscillator(); const tGain = audioCtx.createGain(); tOsc.connect(tGain); tGain.connect(audioCtx.destination); const time = now + (i * 0.5); tOsc.type = 'square'; tOsc.frequency.setValueAtTime(800, time); tOsc.frequency.exponentialRampToValueAtTime(100, time + 0.05); tGain.gain.setValueAtTime(0, time); tGain.gain.linearRampToValueAtTime(0.05, time + 0.01); tGain.gain.exponentialRampToValueAtTime(0.001, time + 0.05); tOsc.start(time); tOsc.stop(time + 0.06); } }
    else if (type === 'win') { osc.type = 'square'; osc.frequency.setValueAtTime(400, now); osc.frequency.setValueAtTime(600, now + 0.1); osc.frequency.setValueAtTime(800, now + 0.2); gain.gain.setValueAtTime(0.03, now); gain.gain.linearRampToValueAtTime(0.03, now + 0.2); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4); osc.start(now); osc.stop(now + 0.4); }
    else if (type === 'lose') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.4); gain.gain.setValueAtTime(0.03, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4); osc.start(now); osc.stop(now + 0.4); }
    else if (type === 'draw') { osc.type = 'square'; osc.frequency.setValueAtTime(300, now); gain.gain.setValueAtTime(0.03, now); gain.gain.setValueAtTime(0.001, now + 0.1); gain.gain.setValueAtTime(0.03, now + 0.15); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25); osc.start(now); osc.stop(now + 0.25); }
}

function toggleInfo() {
    const modal = document.getElementById('info-modal'); const content = document.getElementById('info-modal-content');
    if (modal.classList.contains('hidden')) { modal.classList.remove('hidden'); setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); }, 10); playSfx('click'); }
    else { modal.classList.add('opacity-0'); content.classList.add('scale-95'); setTimeout(() => modal.classList.add('hidden'), 300); playSfx('click'); }
}

let particlesArray = []; let canvas, ctx;
function initParticles() { canvas = document.getElementById('particles'); ctx = canvas.getContext('2d'); resizeCanvas(); window.addEventListener('resize', resizeCanvas); particlesArray = []; const numParticles = Math.min(window.innerWidth / 12, 120); for (let i = 0; i < numParticles; i++) { particlesArray.push(new Particle()); } }
function resizeCanvas() { if(canvas) { canvas.width = window.innerWidth; canvas.height = window.innerHeight; } }
class Particle {
    constructor() { this.x = Math.random() * window.innerWidth; this.y = Math.random() * window.innerHeight; this.size = Math.random() * 3 + 1; this.speedX = Math.random() * 1 - 0.5; this.speedY = Math.random() * 1 - 0.5; const colors = ['rgba(255, 165, 0, 0.4)', 'rgba(141, 198, 63, 0.4)', 'rgba(65, 105, 225, 0.4)', 'rgba(200, 200, 200, 0.4)']; this.color = colors[Math.floor(Math.random() * colors.length)]; }
    update() { this.x += this.speedX; this.y += this.speedY; if (this.size > 0.2) this.size -= 0.005; if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height || this.size <= 0.2) { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 3 + 1; } }
    draw() { ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
}
function animateParticles() { if(!ctx || !canvas) return; ctx.clearRect(0, 0, canvas.width, canvas.height); for (let i = 0; i < particlesArray.length; i++) { particlesArray[i].update(); particlesArray[i].draw(); } connectParticles(); requestAnimationFrame(animateParticles); }
function connectParticles() { let opacityValue = 1; for (let a = 0; a < particlesArray.length; a++) { for (let b = a; b < particlesArray.length; b++) { let dx = particlesArray[a].x - particlesArray[b].x; let dy = particlesArray[a].y - particlesArray[b].y; let distance = dx * dx + dy * dy; if (distance < 12000) { opacityValue = 1 - (distance / 12000); ctx.strokeStyle = `rgba(141, 198, 63, ${opacityValue * 0.15})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(particlesArray[a].x, particlesArray[a].y); ctx.lineTo(particlesArray[b].x, particlesArray[b].y); ctx.stroke(); } } } }

init();
</script>
